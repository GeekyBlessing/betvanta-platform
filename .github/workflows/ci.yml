name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: betvanta_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/betvanta_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: DATABASE_URL=$TEST_DATABASE_URL npm test
      - run: npm audit --omit=dev --audit-level=high
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: betvanta }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/betvanta
      APP_URL: http://localhost:3000
      ADMIN_EMAILS: admin@betvanta.test
      ALLOW_SAMPLE_DATA: "true"
      PAYSTACK_SECRET_KEY: sk_test_ci_stub
      PAYSTACK_BASE_URL: http://127.0.0.1:4599
      CRON_SECRET: ci-cron-secret
      STRIPE_SECRET_KEY: sk_test_ci_stub
      STRIPE_WEBHOOK_SECRET: whsec_ci
      STRIPE_API_BASE: http://127.0.0.1:4599
      NOWPAYMENTS_API_KEY: np_ci
      NOWPAYMENTS_IPN_SECRET: np_ipn_ci
      NOWPAYMENTS_API_BASE: http://127.0.0.1:4599
      CRYPTO_PAYMENTS_ENABLED: "true" # test only; production default is false
      MEMPOOL_API_BASE: http://127.0.0.1:4599
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - name: Enable the least-privilege app role (the server runs as it, like production)
        run: MIGRATION_DATABASE_URL=$DATABASE_URL APP_DB_PASSWORD=ci-app-role-password-0123456789 node scripts/db-app-role.mjs
      - run: npm run build
      - name: No secrets in browser bundle
        run: node scripts/check-client-bundle.mjs
      - run: |
          node scripts/payments-stub.mjs &
          DATABASE_URL=postgres://betvanta_app:ci-app-role-password-0123456789@localhost:5432/betvanta npx next start -p 3000 &
          npx wait-on -t 60000 http://localhost:3000/api/health
          E2E_ADMIN_DATABASE_URL=$DATABASE_URL node tests/e2e/smoke.mjs
